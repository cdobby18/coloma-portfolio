<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Drifted Off the Grand Line — Carl Joshua Coloma</title>
  <meta name="description" content="The sails are torn, the winds took a turn. Drifted off the Grand Line." />
  <link rel="canonical" href="https://carlcoloma.vercel.app/404.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light dark; }
    html[data-theme="dark"] {
      --bg:#111110; --ink:#ede8dc; --card:#191917; --muted:#8f897d; --accent:#e03131;
      --text:#ede8dc; --border:rgba(237,232,220,0.16); --paper:#111110;
    }
    html[data-theme="light"] {
      --bg:#f3eee4; --ink:#171512; --card:#faf7ef; --muted:#6f6a5e; --accent:#c92a2a;
      --text:#171512; --border:rgba(23,21,18,0.18); --paper:#f3eee4;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 620px; padding: 48px 40px; border: 3px solid var(--ink); border-radius: 6px;
      background: var(--card); box-shadow: 8px 8px 0 var(--ink);
    }
    .compass { margin: 0 auto 18px; opacity: .16; }
    h1 { font-family: 'Reggae One','Space Grotesk',sans-serif; font-size: clamp(28px, 6vw, 40px); font-weight: 400; letter-spacing: .02em; margin: 0 0 12px; color: var(--ink); }
    .sub { font-family: 'JetBrains Mono',monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
    p { color: var(--text); font-size: 15px; line-height: 1.8; margin: 0 0 28px; }
    a.back {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 6px;
      background: var(--card); border: 2.5px solid var(--ink); color: var(--text); font-size: 13.5px; font-weight: 600;
      box-shadow: 4px 4px 0 var(--ink); text-decoration: none; transition: transform .15s ease, box-shadow .15s ease;
    }
    a.back:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <svg class="compass" width="110" height="110" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="30" stroke="currentColor" stroke-width="1" />
      <circle cx="50" cy="50" r="22" stroke="currentColor" stroke-width="0.6" stroke-dasharray="2 3" />
      <path d="M50 10 54 46 90 50 54 54 50 90 46 54 10 50 46 46z" fill="currentColor" />
      <text x="50" y="7" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="currentColor">N</text>
    </svg>
    <h1>Drifted Off the Grand Line</h1>
    <div class="sub">The map ends here…</div>
    <p>Even the best crew hits a dead end — and this page does too. The winds took a wrong turn, the anchors ran out, and the crew got hungry for a new adventure.</p>
    <a class="back" href="/">⧉ Back to the Ship</a>
  </div>
</body>
</html>
